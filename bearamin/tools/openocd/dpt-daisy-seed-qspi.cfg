# SPDX-License-Identifier: GPL-2.0-or-later
#
# DPT / Daisy Seed STM32H750 + IS25LP064A QSPI helper for STLINK/OpenOCD.
# This config is intentionally conservative: it configures the single Daisy Seed
# QSPI bank for ordinary 0x03 memory-mapped reads and does not write flash
# configuration registers.

source [find interface/stlink.cfg]

transport select hla_swd

set CHIPNAME stm32h750xbh6

if {![info exists QUADSPI]} {
	set QUADSPI 1
}

source [find target/stm32h7x.cfg]

reset_config srst_only

proc dpt_daisy_seed_qspi_init { } {
	# GPIOA-GPIOK clocks plus QUADSPI peripheral clock.
	mmw 0x580244E0 0x000007FF 0x00000000
	mmw 0x580244D4 0x00004000 0x00000000
	sleep 1

	# Daisy Seed QSPI pins:
	#   PG6  BK1_NCS  AF10
	#   PF8  BK1_IO0  AF10
	#   PF9  BK1_IO1  AF10
	#   PF7  BK1_IO2  AF9
	#   PF6  BK1_IO3  AF9
	#   PF10 CLK      AF9

	# Port F: PF6, PF7, PF8, PF9, PF10 alternate-function, very high speed.
	mmw 0x58021400 0x002AA000 0x00155000
	mmw 0x58021408 0x003FF000 0x00000000
	mmw 0x58021420 0x99000000 0x66000000
	mmw 0x58021424 0x000009AA 0x00000655

	# Port G: PG6 alternate-function, very high speed.
	mmw 0x58021800 0x00002000 0x00001000
	mmw 0x58021808 0x00003000 0x00000000
	mmw 0x58021820 0x0A000000 0x05000000

	# IS25LP064A is 8 MiB: FSIZE = log2(bytes) - 1 = 0x16.
	# Keep dual-flash mode disabled for Daisy Seed's single QSPI flash.
	mmw 0x52005000 0x00000002 0x00000000
	mww 0x52005000 0x05500018
	mww 0x52005004 0x00160200
	mww 0x52005030 0x00001000
	mww 0x52005014 0x0D002503
	mmw 0x52005000 0x00000001 0x00000000
}

$_CHIPNAME.cpu0 configure -event reset-init {
	mmw 0x52002000 0x00000004 0x0000000B

	mmw 0x58024400 0x00000001 0x00000018
	mmw 0x58024410 0x10000000 0xEE000007
	mww 0x58024418 0x00000040
	mww 0x5802441C 0x00000440
	mww 0x58024420 0x00000040
	mww 0x58024428 0x00000040
	mmw 0x5802442C 0x0001000C 0x00000002
	mww 0x58024430 0x01070217
	mmw 0x58024400 0x01000000 0x00000000
	sleep 1
	mmw 0x58024410 0x00000003 0x00000000
	sleep 1

	adapter speed 24000

	if { [info exists QUADSPI] && $QUADSPI } {
		dpt_daisy_seed_qspi_init
	}
}
