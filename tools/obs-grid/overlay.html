<!doctype html><meta charset="utf-8"><title>Field grid</title><style>html,body{margin:0;background:transparent}canvas{display:block;width:100%;height:100%;aspect-ratio:1}</style><canvas width="512" height="512" aria-label="8 by 8 sensing field"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function paint(mm){ctx.clearRect(0,0,512,512);for(let i=0;i<64;i++){if(mm[i]===null)continue;const v=Math.max(0,Math.min(1,(800-mm[i])/740));ctx.fillStyle=`rgba(${Math.round(45+180*v)},${Math.round(140+55*v)},${Math.round(230-150*v)},0.85)`;ctx.beginPath();ctx.roundRect(i%8*64+4,Math.floor(i/8)*64+4,56,56,8);ctx.fill();}}
async function poll(){try{const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error();const f=await r.json();paint(f.mm);}catch{paint(Array(64).fill(null));}setTimeout(poll,100);}poll();
</script>
