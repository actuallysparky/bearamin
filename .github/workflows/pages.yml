name: Bearamin Field Guide
on:
  push:
    branches: [main]
    paths: ['field-guide/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bearamin-pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assemble verified current firmware and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 field-guide/tools/build_site.py --github "${{ github.repository }}" --output _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
